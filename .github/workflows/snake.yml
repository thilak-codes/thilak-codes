
name: Generate Neon Amethyst Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Purple Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: thilak-codes
          outputs: |
            dist/snake-light.svg?color_snake=purple&color_dots=#F3E8FF,#E9D5FF,#C4B5FD,#8B5CF6,#5B21B6
            dist/snake-dark.svg?palette=github-dark&color_snake=#D8B4FE&color_dots=#241A3A,#31205B,#6D28D9,#A78BFA,#E9D5FF

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
