#!/usr/bin/env python3
"""
Generate theme-aware animated profile hero banners (dark.svg & light.svg) for Thilak S M.

Identity: Aspiring Software Developer | CSBS Student.
Features:
- Midnight Crimson HUD aesthetic (black / crimson red / white glow).
- Left Panel: Developer Matrix & Tech Nodes (Python, SQL, Excel, GitHub, Projects, C Language).
- XML Valid: All text nodes escaped with html.escape for 100% SVG/XML compliance.

Usage:  python generate_banner.py [output_dir]
"""
import os, sys, html

THEMES = {
    # Colours taken from Thilak_Midnight_Crimson_GitHub_Banner.svg
    # (key names kept the same as the original script:
    #  CYAN = main red accent, VIOLET = soft red, VIOLET2 = deep red, EMERALD = white accent)
    "dark": {
        "BG": "#090A0D",
        "PANEL": "#0D0F13",
        "PANEL_CARD": "#14171C",
        "HEADER_BG": "#111318",
        "CYAN": "#FF3030",
        "CYAN_GLOW": "rgba(255,48,48,0.4)",
        "VIOLET": "#FF6B6B",
        "VIOLET2": "#E10600",
        "EMERALD": "#F2F2F2",
        "TEXT": "#F5F5F5",
        "MUTED": "#A8ADB7",
        "DIM": "#737985",
        "ICON_GREY": "#B8BDC7",
        "DOT3": "#F5F5F5",
        "STROKE": "rgba(225,6,0,0.35)",
        "STROKE_HI": "rgba(225,6,0,0.75)",
        "BARLINE": "rgba(255,255,255,0.08)",
        "PILL_BG": "rgba(225,6,0,0.18)",
        "PILL_STROKE": "rgba(225,6,0,0.55)",
        "NODE_BG": "#171A20",
        "NODE_STROKE": "rgba(225,6,0,0.35)",
        "SHIELD_FILL": "rgba(225,6,0,0.15)",
    },
    # Light version of the same crimson palette
    "light": {
        "BG": "#F5F5F7",
        "PANEL": "#FFFFFF",
        "PANEL_CARD": "#F8F8FA",
        "HEADER_BG": "#E8E8EC",
        "CYAN": "#D90500",
        "CYAN_GLOW": "rgba(217,5,0,0.3)",
        "VIOLET": "#E11D1D",
        "VIOLET2": "#B80500",
        "EMERALD": "#111318",
        "TEXT": "#0D0F13",
        "MUTED": "#4B5160",
        "DIM": "#8A8F9B",
        "ICON_GREY": "#6B7080",
        "DOT3": "#27c93f",
        "STROKE": "rgba(217,5,0,0.35)",
        "STROKE_HI": "rgba(217,5,0,0.70)",
        "BARLINE": "rgba(0,0,0,0.08)",
        "PILL_BG": "rgba(217,5,0,0.10)",
        "PILL_STROKE": "rgba(217,5,0,0.40)",
        "NODE_BG": "#F1F1F4",
        "NODE_STROKE": "rgba(217,5,0,0.30)",
        "SHIELD_FILL": "rgba(217,5,0,0.12)",
    },
}

W = 1180
H = 610
FONT = "ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"

# ---- Profile details ----
NAME = "Thilak S M"
EMAIL = "thilaksm.30@gmail.com"
TERMINAL_TITLE = f"{EMAIL} - % ./developer-profile.sh --live"


def esc(s):
    return html.escape(str(s), quote=True)


def generate_dev_panel(theme_cfg):
    """Left panel: Developer HUD + tech nodes."""
    t = theme_cfg
    out = []
    a = out.append

    a(f'<text x="200" y="32" text-anchor="middle" font-size="11" letter-spacing="2.5" font-weight="700" fill="{t["CYAN"]}">DEV.PROFILE // CODE &amp; BUILD</text>')

    # Status bar
    a('<g transform="translate(20, 44)">')
    a(f'  <rect width="360" height="26" rx="6" fill="{t["NODE_BG"]}" stroke="{t["NODE_STROKE"]}"/>')
    a(f'  <circle cx="15" cy="13" r="4" fill="{t["EMERALD"]}">'
      f'    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>'
      f'  </circle>')
    a(f'  <text x="26" y="17" font-size="9.5" font-weight="700" fill="{t["EMERALD"]}">DEVELOPER NODE <tspan fill="{t["MUTED"]}">| LEARN | BUILD | IMPROVE</tspan></text>')
    a('</g>')

    # Central HUD core
    cx, cy = 200, 155
    a(f'<g transform="translate({cx},{cy})">')
    a(f'  <circle cx="0" cy="0" r="62" fill="none" stroke="{t["CYAN"]}" stroke-width="1.2" stroke-dasharray="8,5,15,5" opacity="0.65">')
    a('    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>')
    a('  </circle>')
    a(f'  <circle cx="0" cy="0" r="48" fill="none" stroke="{t["VIOLET"]}" stroke-width="1" stroke-dasharray="4,4" opacity="0.6">')
    a('    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>')
    a('  </circle>')
    a(f'  <path d="M 0,-28 L 22,-14 L 22,12 L 0,28 L -22,12 L -22,-14 Z" fill="{t["SHIELD_FILL"]}" stroke="{t["CYAN"]}" stroke-width="2">')
    a(f'    <animate attributeName="stroke" values="{t["CYAN"]};{t["EMERALD"]};{t["CYAN"]}" dur="3s" repeatCount="indefinite"/>')
    a('  </path>')
    a(f'  <rect x="-7" y="-2" width="14" height="12" rx="2" fill="{t["CYAN"]}"/>')
    a(f'  <path d="M -5,-2 A 5 5 0 0 1 5,-2" fill="none" stroke="{t["CYAN"]}" stroke-width="2"/>')
    a(f'  <circle cx="0" cy="4" r="2" fill="{t["PANEL"]}"/>')
    a(f'  <line x1="-55" y1="0" x2="55" y2="0" stroke="{t["EMERALD"]}" stroke-width="1.5" opacity="0.8">')
    a('    <animateTransform attributeName="transform" type="translate" values="0 -45; 0 45; 0 -45" dur="3s" repeatCount="indefinite"/>')
    a('    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>')
    a('  </line>')
    a(f'  <line x1="-66" y1="0" x2="-58" y2="0" stroke="{t["CYAN"]}" stroke-width="1.5"/>')
    a(f'  <line x1="58" y1="0" x2="66" y2="0" stroke="{t["CYAN"]}" stroke-width="1.5"/>')
    a(f'  <line x1="0" y1="-66" x2="0" y2="-58" stroke="{t["CYAN"]}" stroke-width="1.5"/>')
    a(f'  <line x1="0" y1="58" x2="0" y2="66" stroke="{t["CYAN"]}" stroke-width="1.5"/>')
    a('</g>')

    # Connections
    a(f'<path d="M 200,220 L 200,235 M 200,235 L 105,250 M 200,235 L 295,250" stroke="{t["STROKE"]}" stroke-width="1.2" stroke-dasharray="3,3"/>')

    # (name, category, category colour, icon, x, y, delay)
    nodes = [
        ("Python",   "Programming",      t["CYAN"],    "flutter", 20,  248, "0.2s"),
        ("SQL",      "Database",         t["TEXT"],    "react",   205, 248, "0.35s"),
        ("Excel",    "Data Analysis",    t["CYAN"],    "mongodb", 20,  324, "0.50s"),
        ("GitHub",   "Version Control",  t["CYAN"],    "nodejs",  205, 324, "0.65s"),
        ("Projects", "Hands-on Work",    t["VIOLET2"], "python",  20,  400, "0.80s"),
        ("C Language", "Core Programming", t["CYAN"],  "java",    205, 400, "0.95s"),
    ]

    for name, cat, col, icon_t, nx, ny, delay in nodes:
        a(f'<g opacity="0" transform="translate({nx}, {ny})">')
        a(f'  <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="{delay}" fill="freeze"/>')
        a(f'  <rect width="175" height="64" rx="8" fill="{t["NODE_BG"]}" stroke="{t["NODE_STROKE"]}">'
          f'    <animate attributeName="stroke" values="{t["NODE_STROKE"]};{t["STROKE_HI"]};{t["NODE_STROKE"]}" dur="3.5s" begin="{delay}" repeatCount="indefinite"/>'
          f'  </rect>')

        a('  <g transform="translate(26, 32)">')

        if icon_t == "flutter":
            a(f'    <path d="M 6,-14 L 14,-14 L 0,0 L 14,14 L 6,14 L -8,0 Z" fill="{t["TEXT"]}"/>')
            a(f'    <path d="M 0,0 L 6,-6 L 14,-6 L 8,0 Z" fill="{t["ICON_GREY"]}"/>')
            a(f'    <path d="M 0,0 L 6,6 L 14,6 L 8,0 Z" fill="{t["CYAN"]}"/>')

        elif icon_t == "react":
            a(f'    <circle cx="0" cy="0" r="3.5" fill="{t["TEXT"]}"/>')
            a('    <g>')
            a('      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>')
            a(f'      <ellipse cx="0" cy="0" rx="15" ry="5.5" fill="none" stroke="{t["TEXT"]}" stroke-width="1.4"/>')
            a(f'      <ellipse cx="0" cy="0" rx="15" ry="5.5" fill="none" stroke="{t["TEXT"]}" stroke-width="1.4" transform="rotate(60)"/>')
            a(f'      <ellipse cx="0" cy="0" rx="15" ry="5.5" fill="none" stroke="{t["TEXT"]}" stroke-width="1.4" transform="rotate(120)"/>')
            a('    </g>')

        elif icon_t == "mongodb":
            a(f'    <path d="M 0,-15 C 6,-6 10,2 0,16 C -10,2 -6,-6 0,-15 Z" fill="{t["CYAN"]}"/>')
            a('    <path d="M 0,-15 C 2,-6 5,2 0,16 Z" fill="#3F2A1D" opacity="0.3"/>')
            a('    <line x1="0" y1="-14" x2="0" y2="15" stroke="#FFFFFF" stroke-width="0.9" opacity="0.8"/>')

        elif icon_t == "nodejs":
            a(f'    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="{t["CYAN"]}"/>')
            a(f'    <path d="M -4,-4 L -4,4 L 0,6 L 4,4 L 4,-4 Z" fill="{t["PANEL"]}"/>')
            a(f'    <circle cx="0" cy="0" r="2.5" fill="{t["CYAN"]}"/>')

        elif icon_t == "python":
            a(f'    <path d="M -2,-14 C -8,-14 -12,-10 -12,-5 C -12,0 -8,0 -8,0 L 0,0 L 0,-4 L -6,-4 C -6,-4 -8,-4 -8,-6 C -8,-8 -6,-10 -2,-10 L 4,-10 L 4,-14 Z" fill="{t["VIOLET2"]}"/>')
            a(f'    <path d="M 2,14 C 8,14 12,10 12,5 C 12,0 8,0 8,0 L 0,0 L 0,4 L 6,4 C 6,4 8,4 8,6 C 8,8 6,10 2,10 L -4,10 L -4,14 Z" fill="{t["TEXT"]}"/>')
            a('    <circle cx="-4" cy="-10" r="1.2" fill="#FFFFFF"/>')
            a('    <circle cx="4" cy="10" r="1.2" fill="#FFFFFF"/>')

        elif icon_t == "java":
            a(f'    <path d="M -8,2 L 6,2 L 4,11 C 4,13 -4,13 -6,11 Z" fill="none" stroke="{t["CYAN"]}" stroke-width="1.6"/>')
            a(f'    <path d="M 6,4 C 9,4 9,8 6,8" fill="none" stroke="{t["CYAN"]}" stroke-width="1.4"/>')
            a(f'    <path d="M -4,-3 C -2,-6 -6,-9 -3,-12" fill="none" stroke="{t["MUTED"]}" stroke-width="1.4"/>')
            a(f'    <path d="M 1,-3 C 3,-6 -1,-9 2,-12" fill="none" stroke="{t["TEXT"]}" stroke-width="1.4"/>')

        a('  </g>')

        a(f'  <text x="48" y="27" font-size="12" font-weight="800" fill="{t["TEXT"]}">{esc(name)}</text>')
        a(f'  <text x="48" y="44" font-size="9.5" font-weight="600" fill="{col}">{esc(cat)}</text>')

        a(f'  <circle cx="160" cy="16" r="3" fill="{t["CYAN"]}">'
          f'    <animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="{delay}" repeatCount="indefinite"/>'
          f'  </circle>')
        a('</g>')

    return "".join(out)


def generate_svg(theme_name):
    t = THEMES[theme_name]
    gid = f"accent_b_{theme_name}"

    s = []
    a = s.append

    a(f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="{FONT}" role="img" aria-label="{esc(NAME)} Developer Profile Banner">')

    a('<defs>')
    a(f'  <linearGradient id="{gid}" x1="0" y1="0" x2="1" y2="0">')
    a(f'    <stop offset="0" stop-color="{t["VIOLET2"]}"><animate attributeName="stop-color" values="{t["VIOLET2"]};{t["CYAN"]};{t["EMERALD"]};{t["VIOLET2"]}" dur="10s" repeatCount="indefinite"/></stop>')
    a(f'    <stop offset="0.5" stop-color="{t["CYAN"]}"><animate attributeName="stop-color" values="{t["CYAN"]};{t["EMERALD"]};{t["VIOLET2"]};{t["CYAN"]}" dur="10s" repeatCount="indefinite"/></stop>')
    a(f'    <stop offset="1" stop-color="{t["EMERALD"]}"><animate attributeName="stop-color" values="{t["EMERALD"]};{t["VIOLET2"]};{t["CYAN"]};{t["EMERALD"]}" dur="10s" repeatCount="indefinite"/></stop>')
    a('  </linearGradient>')
    a(f'  <clipPath id="winClip"><rect x="2" y="2" width="{W-4}" height="{H-4}" rx="18"/></clipPath>')
    a('</defs>')

    a(f'<rect x="2" y="2" width="{W-4}" height="{H-4}" rx="18" fill="{t["BG"]}"/>')
    a('<g clip-path="url(#winClip)">')
    a(f'<rect x="2" y="2" width="{W-4}" height="{H-4}" fill="none" stroke="url(#{gid})" stroke-width="3" opacity="0.8"/>')

    # Header bar
    a(f'<rect x="2" y="2" width="{W-4}" height="46" fill="{t["HEADER_BG"]}"/>')
    a(f'<line x1="2" y1="48" x2="{W-2}" y2="48" stroke="{t["BARLINE"]}"/>')
    a('<circle cx="30" cy="25" r="5.5" fill="#ff5f56"/>')
    a('<circle cx="50" cy="25" r="5.5" fill="#ffbd2e"/>')
    a(f'<circle cx="70" cy="25" r="5.5" fill="{t["DOT3"]}"/>')
    a(f'<text x="{W/2}" y="29" text-anchor="middle" font-size="12" fill="{t["MUTED"]}">{esc(TERMINAL_TITLE)}</text>')

    # ---------- LEFT PANEL ----------
    a('<g transform="translate(36, 84)">')
    a(f'  <rect width="400" height="492" rx="12" fill="{t["PANEL"]}" stroke="{t["STROKE"]}">'
      f'    <animate attributeName="stroke" values="{t["STROKE"]};{t["STROKE_HI"]};{t["STROKE"]}" dur="4s" repeatCount="indefinite"/>'
      f'  </rect>')
    a(generate_dev_panel(t))
    a('</g>')

    # ---------- RIGHT PANEL ----------
    a('<g transform="translate(460, 84)">')
    a(f'  <rect width="684" height="492" rx="12" fill="{t["PANEL"]}" stroke="{t["STROKE"]}">'
      f'    <animate attributeName="stroke" values="{t["STROKE"]};{t["STROKE_HI"]};{t["STROKE"]}" dur="4s" begin="1s" repeatCount="indefinite"/>'
      f'  </rect>')

    a(f'  <text x="24" y="32" font-size="11" letter-spacing="2.5" font-weight="700" fill="{t["CYAN"]}">SYSTEM.INFO // DEVELOPER PROFILE</text>')
    a(f'  <text x="560" y="32" font-size="10" fill="{t["DIM"]}">./thilak.sh --dev</text>')
    a(f'  <line x1="24" y1="42" x2="660" y2="42" stroke="url(#{gid})" stroke-width="1.5" opacity="0.7"/>')

    a('  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>')
    a(f'    <text x="24" y="74" font-size="13" fill="{t["EMERALD"]}">thilak@dev-box:~$ <tspan fill="{t["CYAN"]}">whoami --verbose</tspan></text>')
    a('  </g>')

    info_items = [
        ("NAME",       "Thilak S M"                                                 t["TEXT"],    "0.35s"),
        ("ROLE",       "CSBS Student | Aspiring Software Developer",           t["VIOLET"],  "0.50s"),
        ("BASE",       "Tamil Nadu, India 🇮🇳",                                 t["TEXT"],    "0.65s"),
        ("FOCUS",      "Software Development • Python • Data Analytics",       t["CYAN"],    "0.80s"),
        ("CORE_STACK", "Python • SQL • Excel • GitHub • C",                    t["EMERALD"], "0.95s"),
        ("STATUS",     "⚡ Seeking Software Development Internships",           t["EMERALD"], "1.10s"),
        ("CONTACT",    "thilaksm.30@gmail.com",                                                  t["VIOLET"],  "1.25s"),
    ]

    start_y = 108
    for i, (label, val, col, b_anim) in enumerate(info_items):
        cur_y = start_y + i * 32
        a(f'  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="{b_anim}" fill="freeze"/>')
        a(f'    <text x="24" y="{cur_y}" font-size="11.5" font-weight="700" fill="{t["MUTED"]}" xml:space="preserve">{esc(f"{label:<11}")}: </text>')
        a(f'    <text x="135" y="{cur_y}" font-size="11.5" font-weight="600" fill="{col}">{esc(val)}</text>')
        a('  </g>')

    # Blinking cursor
    a(f'  <text x="365" y="{start_y + 6 * 32}" font-size="13" font-weight="bold" fill="{t["CYAN"]}">_<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></text>')

    # Skill pills
    a('  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>')
    a(f'    <text x="24" y="348" font-size="10" letter-spacing="1.5" font-weight="700" fill="{t["DIM"]}">SKILLS &amp; LEARNING</text>')

    tags = ["Python", "SQL", "C", "GitHub", "Excel", "Projects", "Learning", "Problem Solving"]
    tx = 24
    ty = 360
    for tag in tags:
        tw = len(tag) * 7.5 + 16
        if tx + tw > 650:
            tx = 24
            ty += 26
        a(f'    <rect x="{tx}" y="{ty}" width="{tw:.1f}" height="20" rx="10" fill="{t["PILL_BG"]}" stroke="{t["PILL_STROKE"]}"/>')
        a(f'    <text x="{tx + tw/2:.1f}" y="{ty + 13.5}" text-anchor="middle" font-size="10" font-weight="600" fill="{t["VIOLET"]}">{esc(tag)}</text>')
        tx += tw + 8
    a('  </g>')

    # Metrics footer
    a('  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.55s" fill="freeze"/>')
    a(f'    <rect x="24" y="420" width="636" height="52" rx="10" fill="{t["PANEL_CARD"]}" stroke="{t["BARLINE"]}"/>')

    a(f'    <text x="44" y="441" font-size="9" font-weight="700" fill="{t["DIM"]}">PINNED REPOS</text>')
    a(f'    <text x="44" y="460" font-size="14" font-weight="800" fill="{t["CYAN"]}">Projects</text>')
    a(f'    <line x1="210" y1="430" x2="210" y2="462" stroke="{t["BARLINE"]}"/>')

    a(f'    <text x="230" y="441" font-size="9" font-weight="700" fill="{t["DIM"]}">SPECIALTY</text>')
    a(f'    <text x="230" y="460" font-size="14" font-weight="800" fill="{t["VIOLET"]}">Software Dev</text>')
    a(f'    <line x1="430" y1="430" x2="430" y2="462" stroke="{t["BARLINE"]}"/>')

    a(f'    <text x="450" y="441" font-size="9" font-weight="700" fill="{t["DIM"]}">SECURITY STATUS</text>')
    a(f'    <text x="450" y="460" font-size="13" font-weight="800" fill="{t["EMERALD"]}">● BUILDING <tspan font-size="10" font-weight="normal" fill="{t["MUTED"]}">v1.0</tspan></text>')
    a('  </g>')

    a('</g>')   # right panel
    a('</g>')   # clip group
    a('</svg>')

    return "".join(s)


def main():
    out_dir = sys.argv[1] if len(sys.argv) > 1 else "."
    os.makedirs(out_dir, exist_ok=True)

    for theme, fname in [("dark", "dark.svg"), ("light", "light.svg")]:
        svg_content = generate_svg(theme)
        out_path = os.path.join(out_dir, fname)
        with open(out_path, "w", encoding="utf-8") as f:
            f.write(svg_content)
        print(f"Generated {out_path} ({theme}): {len(svg_content)//1024} KB")


if __name__ == "__main__":
    main()
