name: Generate Neon Amethyst Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Purple Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: thilak-codes
          outputs: |
            dist/snake-light.svg?color_snake=%238B5CF6&color_dots=%23100B1F,%2331205B,%238B5CF6,%23A78BFA,%23D8B4FE
            dist/snake-dark.svg?color_snake=%23D8B4FE&color_dots=%23100B1F,%2331205B,%238B5CF6,%23A78BFA,%23D8B4FE

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
